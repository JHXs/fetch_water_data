<body>

        <div class="fr topright">

                <li rel="RealDatas.html" class="selected">实时数据</li>
                <li rel="Explain.html">发布说明</li>

<script src="/Scripts/jquery-3.4.1.min.js" type="text/javascript"></script>

<script src="/GJZ/Scripts/Publish/Publish.js"></script>
<script type="text/javascript">
    var pageName = RequestFrom("Page");
    if (!pageName) {
        pageName = "RealDatas";
    }
    $("#MF").attr("src", pageName + ".html");

    $(function () {
        $("#ul_menu li").click(function () {
            $(this).addClass("selected").siblings().removeClass("selected");
            $("#MF").attr("src", this.getAttribute("rel"));
        });
    })
</script>
